name: Background Paper Assessment

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper PyMuPDF pandas numpy plotly pyvis torch web3 groq streamlit

      - name: Run Background Assessment
        run: python app.py --cron
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_SECRET_API_KEY: ${{ secrets.PINATA_SECRET_API_KEY }}
          ETH_ADMIN_PRIVATE_KEY: ${{ secrets.ETH_ADMIN_PRIVATE_KEY }}
          REGISTRY_CONTRACT_ADDRESS: ${{ secrets.REGISTRY_CONTRACT_ADDRESS }}
          PIQ_CONTRACT_ADDRESS: ${{ secrets.PIQ_CONTRACT_ADDRESS }}
          WEB3_PROVIDER_URI: ${{ secrets.WEB3_PROVIDER_URI }}
