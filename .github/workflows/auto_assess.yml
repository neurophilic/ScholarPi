name: Pi-Index Background Assessment Cron (5-Min Interval)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  background-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git & Install Python
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sudo apt-get update && sudo apt-get install -y python3 python3-pip python3-venv

      - name: Checkout repository manually
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          pip3 install requests groq pandas --break-system-packages

      - name: Run automated assessment script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 background_assessor.py

      - name: Commit and push updated database
        run: |
          git status
          git add pi_index_main.db
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Autonomous background assessment update (5-min interval)"
          git push origin main
