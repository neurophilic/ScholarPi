name: Pi-Index Background Assessment Cron (5-Min Interval)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write # Required to allow GitHub Actions to commit and push changes back

jobs:
  background-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests groq pandas

      - name: Run automated assessment script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python background_assessor.py

      - name: Commit updated SQLite database back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Autonomous background assessment update (5-min interval)"
          file_pattern: "pi_index_main.db"
