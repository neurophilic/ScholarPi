name: Pi-Index Background Assessment Cron (5-Min Interval)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  background-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo, Install Python, and Run Assessment
        run: |
          # 1. Set up Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Clone the repository directly using HTTPS and token credentials
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          
          # 3. Install Python and dependencies natively via apt/pip
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip --break-system-packages
          pip3 install requests groq pandas --break-system-packages
          
          # 4. Execute your background assessment script
          python3 background_assessor.py
          
          # 5. Commit and push any updated database changes back to the repository
          git status
          git add pi_index_main.db
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Autonomous background assessment update (5-min interval)"
          git push origin main
